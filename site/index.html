<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synths</title>
<style>
:root { color-scheme: dark; --ground: #111418; --ink: #e2e6ea; --muted: #98a3ae; --card: #1b2028; --rule: #2c3440; --accent: #6cc4c4; }
body { background: var(--ground); color: var(--ink); margin: 0; padding: 32px 16px 48px; font: 16px/1.5 system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; }
h1 { font-weight: 300; letter-spacing: .06em; margin: 0 0 4px; }
p.sub { color: var(--muted); margin: 0 0 24px; }
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
li { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; }
li a.open { color: var(--ink); font-size: 1.25rem; font-weight: 600; text-decoration: none; }
li a.open:hover { color: var(--accent); }
li p { margin: 4px 0 6px; }
li small { color: var(--muted); }
li small a { color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>SYNTHS</h1>
<p class="sub">Synth engines that run in your browser, built from source.</p>
<ul id="list"><li>Loading.</li></ul>
</main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
fetch("engines.json").then((r) => r.json()).then((engines) => {
  document.getElementById("list").innerHTML = engines.map((e) => `
    <li><a class="open" href="${esc(e.url)}">${esc(e.label)}</a>
      <p>${esc(e.description)}</p>
      <small>${esc(e.family)} · ${esc(e.licence)} ·
        <a href="${esc(e.homepage)}">home</a> ·
        <a href="${esc(e.source)}">source (${esc(e.rev.slice(0, 7))})</a></small></li>`).join("");
}).catch((err) => { document.getElementById("list").innerHTML = `<li>Could not load the catalog: ${esc(err.message)}</li>`; });
</script>
</body>
</html>
